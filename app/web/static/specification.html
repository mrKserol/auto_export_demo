<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Спецификация автомобиля</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/specification.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Спецификация автомобиля</h1>
      <p class="subtitle">Заполните параметры желаемого автомобиля. Все поля, кроме комплектации, обязательны.</p>
    </header>

    <div id="form-error" class="alert alert-error" hidden></div>
    <div id="form-success" class="alert alert-success" hidden></div>

    <form id="specification-form" novalidate>
      <label class="field">
        <span>Марка</span>
        <input type="text" name="brand" placeholder="Buick" maxlength="100" required />
        <small class="field-error" data-error-for="brand"></small>
      </label>

      <label class="field">
        <span>Модель</span>
        <input type="text" name="model" placeholder="Encore" maxlength="100" required />
        <small class="field-error" data-error-for="model"></small>
      </label>

      <label class="field">
        <span>Год выпуска</span>
        <input type="number" name="year" placeholder="2023" required />
        <small class="field-error" data-error-for="year"></small>
      </label>

      <label class="field">
        <span>Объём двигателя, л</span>
        <input type="number" name="eng_capacity" placeholder="1.3" step="0.1" min="0.1" max="20" required />
        <small class="field-error" data-error-for="eng_capacity"></small>
      </label>

      <label class="field">
        <span>Тип двигателя</span>
        <select name="eng_type" required>
          <option value="">Выберите</option>
          <option>Бензин</option>
          <option>Дизель</option>
          <option>Гибрид</option>
          <option>Подключаемый гибрид</option>
          <option>Электро</option>
        </select>
        <small class="field-error" data-error-for="eng_type"></small>
      </label>

      <label class="field">
        <span>Привод</span>
        <select name="drive" required>
          <option value="">Выберите</option>
          <option>Передний</option>
          <option>Задний</option>
          <option>Полный</option>
        </select>
        <small class="field-error" data-error-for="drive"></small>
      </label>

      <label class="field">
        <span>КПП</span>
        <select name="transmission" required>
          <option value="">Выберите</option>
          <option>МКПП</option>
          <option>АКПП</option>
          <option>Робот</option>
          <option>Вариатор</option>
          <option>Редуктор</option>
        </select>
        <small class="field-error" data-error-for="transmission"></small>
      </label>

      <label class="field">
        <span>Цвет</span>
        <input type="text" name="color" placeholder="белый" maxlength="100" required />
        <small class="field-error" data-error-for="color"></small>
      </label>

      <label class="field">
        <span>Комплектация</span>
        <input type="text" name="complectation" placeholder="RS" maxlength="200" />
        <small class="field-error" data-error-for="complectation"></small>
      </label>

      <label class="field">
        <span>Пробег, км</span>
        <input type="number" name="mileage" placeholder="50000" min="0" required />
        <small class="field-error" data-error-for="mileage"></small>
      </label>

      <label class="field">
        <span>Стоимость</span>
        <div class="price-row">
          <input type="number" name="price" placeholder="100000" min="1" step="1" required />
          <span class="currency">CNY</span>
        </div>
        <small class="field-error" data-error-for="price"></small>
      </label>

      <button type="submit" id="fallback-submit" class="fallback-submit">
        Сохранить спецификацию
      </button>
    </form>
  </main>

  <script src="/static/specification.js"></script>
</body>
</html>
