<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Расчёт сметы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/estimate.css?v=2" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Расчёт сметы</h1>
      <p class="subtitle">Заполните расходы на покупку и доставку автомобиля</p>
    </header>

    <div id="form-error" class="alert alert-error" hidden></div>
    <div id="form-success" class="alert alert-success" hidden></div>

    <form id="estimate-form" novalidate>
      <label class="field"><span>Мощность автомобиля, л.с.</span><input type="number" name="engine_power" min="1" step="1" placeholder="155" required /><small data-error-for="engine_power" class="field-error"></small></label>
      <label class="field"><span>Курс валюты к рублю</span><input type="number" name="exchange_rate" min="0.000001" step="0.000001" placeholder="11.74" required /><small class="hint">Например: 11.74 для CNY или 0.57 для JPY</small><small data-error-for="exchange_rate" class="field-error"></small></label>
      <label class="field"><span>Осмотр и транспортировка в КНР</span><input type="number" name="inspect_transport_price" min="0" step="0.01" placeholder="11000" required /><span class="currency">CNY</span><small data-error-for="inspect_transport_price" class="field-error"></small></label>
      <label class="field"><span>Банковская комиссия</span><input type="number" name="bank_commission" min="0" step="0.01" placeholder="0" required /><span class="currency">RUB</span><small data-error-for="bank_commission" class="field-error"></small></label>
      <label class="field"><span>Приёмка в РК и транзит</span><input type="number" name="transit_declaration_price" min="0" step="0.01" placeholder="35000" required /><span class="currency">RUB</span><small data-error-for="transit_declaration_price" class="field-error"></small></label>
      <label class="field"><span>Страхование и доставка</span><input type="number" name="insurance_shipment" min="0" step="0.01" placeholder="100000" required /><span class="currency">RUB</span><small data-error-for="insurance_shipment" class="field-error"></small></label>
      <label class="field"><span>Таможенная очистка</span><input type="number" name="custom_clearing" min="0" step="0.01" placeholder="65000" required /><span class="currency">RUB</span><small data-error-for="custom_clearing" class="field-error"></small></label>
      <label class="field"><span>Комиссия исполнителя</span><input type="number" name="contractor_comission" min="0" step="0.01" placeholder="150000" required /><span class="currency">RUB</span><small data-error-for="contractor_comission" class="field-error"></small></label>

      <!-- Main action is provided by Telegram WebApp MainButton; keep no in-form submit to avoid duplication -->
    </form>
  </main>
  <script src="/static/estimate.js?v=2" defer></script>
</body>
</html>
